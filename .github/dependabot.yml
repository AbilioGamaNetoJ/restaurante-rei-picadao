version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    target-branch: main
    groups:
      next:
        patterns:
          - next
          - eslint-config-next
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      clerk:
        patterns:
          - "@clerk/*"
      database:
        patterns:
          - drizzle-orm
          - drizzle-kit
          - "@neondatabase/serverless"
      dev-tools:
        patterns:
          - vitest
          - "@playwright/test"
          - typescript
          - eslint
    ignore:
      - dependency-name: effect
        update-types: ["version-update:semver-*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
