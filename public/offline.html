<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#dc2626">
  <title>Sem Conexão — Rei do Picadão</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #fef2f2 0%, #fff7ed 50%, #fefce8 100%);
      color: #1e293b;
      padding: 2rem;
      padding-top: max(2rem, env(safe-area-inset-top));
      padding-bottom: max(2rem, env(safe-area-inset-bottom));
    }

    .container {
      text-align: center;
      max-width: 420px;
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin: 0 auto 2rem;
      box-shadow: 0 20px 40px rgba(220, 38, 38, 0.15);
      border: 4px solid white;
    }

    .icon-offline {
      font-size: 3.5rem;
      margin-bottom: 1.5rem;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
      color: #0f172a;
    }

    p {
      font-size: 1rem;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .btn-retry {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #dc2626;
      color: white;
      border: none;
      padding: 0.875rem 2rem;
      border-radius: 9999px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(220, 38, 38, 0.3);
    }

    .btn-retry:hover {
      background: #b91c1c;
      transform: scale(1.03);
      box-shadow: 0 6px 20px rgba(220, 38, 38, 0.4);
    }

    .btn-retry:active {
      transform: scale(0.97);
    }

    .footer {
      margin-top: 3rem;
      font-size: 0.75rem;
      color: #94a3b8;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="container">
    <img id="logo" src="/icons/icon-192x192.png" alt="Rei do Picadão" class="logo">
    <div class="icon-offline">📡</div>
    <h1>Sem conexão</h1>
    <p>Parece que você está offline. Verifique sua conexão com a internet e tente novamente.</p>
    <button id="retry-btn" class="btn-retry" type="button">
      🔄 Tentar novamente
    </button>
    <div class="footer">Rei do Picadão</div>
  </div>
  <script>
    document.getElementById('logo').addEventListener('error', function () {
      this.style.display = 'none';
    });
    document.getElementById('retry-btn').addEventListener('click', function () {
      window.location.reload();
    });
  </script>
</body>
</html>
